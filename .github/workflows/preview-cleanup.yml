name: Clean up website Preview

on:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: Clean up Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-website-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - name: Delete closed PR Preview
        working-directory: apps/website
        run: vp exec node scripts/preview-lifecycle.ts cleanup
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
