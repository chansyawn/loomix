packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/inter": ^5.3.0
  "@types/node": ^24
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  lucide-react: ^1.47.0
  oxc-transform-react: ^0.154.0
  shadcn: ^4.21.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
